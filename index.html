<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora CDB Inter</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <h1>Calculadora CDB Inter</h1>

        <div class="calculator">
            <div class="tabs">
                <button class="tab-btn active" data-tab="cdb">CDB Inter</button>
                <button class="tab-btn" data-tab="comparacao">Comparação</button>
            </div>

            <div class="tab-content active" id="cdb">
                <form id="cdbForm">
                    <div class="form-group">
                        <label for="valorInvestimento">Valor do Investimento (R$)</label>
                        <input type="number" id="valorInvestimento" required min="0" step="0.01">
                    </div>
                    <div class="form-group">
                        <label for="prazo">Prazo do Investimento</label>
                        <select id="prazo" required>
                            <option value="30">30 dias</option>
                            <option value="60">60 dias</option>
                            <option value="90">90 dias</option>
                            <option value="180">180 dias</option>
                            <option value="360">360 dias</option>
                            <option value="720">720 dias</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taxa">Taxa CDI</label>
                        <input type="number" id="taxa" value="13.65" readonly>
                        <small class="info-text">Taxa atual do CDI (atualizada automaticamente)</small>
                    </div>
                    <div class="form-group">
                        <label for="percentualCDI">Percentual do CDI</label>
                        <input type="number" id="percentualCDI" value="100" readonly>
                        <small class="info-text">Percentual oferecido pelo CDB Inter</small>
                    </div>
                    <button type="submit" class="calculate-btn">Calcular</button>
                </form>
            </div>

            <div class="tab-content" id="comparacao">
                <form id="comparacaoForm">
                    <div class="form-group">
                        <label for="valorComparacao">Valor do Investimento (R$)</label>
                        <input type="number" id="valorComparacao" required min="0" step="0.01">
                    </div>
                    <div class="form-group">
                        <label for="prazoComparacao">Prazo do Investimento</label>
                        <select id="prazoComparacao" required>
                            <option value="30">30 dias</option>
                            <option value="60">60 dias</option>
                            <option value="90">90 dias</option>
                            <option value="180">180 dias</option>
                            <option value="360">360 dias</option>
                            <option value="720">720 dias</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taxaComparacao">Taxa de Outro Investimento (% a.a.)</label>
                        <input type="number" id="taxaComparacao" required min="0" step="0.01">
                    </div>
                    <button type="submit" class="calculate-btn">Comparar</button>
                </form>
            </div>
        </div>

        <div class="result-container">
            <div class="result-card">
                <h2>Resultado</h2>
                <div class="result-content">
                    <div class="result-value">
                        <span class="currency">R$</span>
                        <span class="amount">0,00</span>
                    </div>
                    <div class="result-details">
                        <div class="detail-item">
                            <span class="label">Rendimento Bruto:</span>
                            <span class="value">R$ 0,00</span>
                        </div>
                        <div class="detail-item">
                            <span class="label">IR:</span>
                            <span class="value">R$ 0,00</span>
                        </div>
                        <div class="detail-item">
                            <span class="label">Rendimento Líquido:</span>
                            <span class="value">R$ 0,00</span>
                        </div>
                        <div class="detail-item">
                            <span class="label">Taxa Efetiva:</span>
                            <span class="value">0,00%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="comparisonChart"></canvas>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>

</html>

</html>
